name: Refresh profile artwork

on:
  schedule:
    - cron: '17 20 * * *' # 04:17 Asia/Singapore; GitHub schedules may be delayed.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profile.yml', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Refresh public statistics
        run: python3 scripts/refresh_snapshot.py --username "$PROFILE_USERNAME"
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?color_snake=#8b5cf6
            assets/snake-dark.svg?palette=github-dark&color_snake=#a78bfa
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate Pac-Man and Breakout
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,breakout'

      - name: Generate 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect and validate artwork
        run: |
          cp dist/pacman-contribution-graph*.svg assets/
          cp dist/breakout-contribution-graph*.svg assets/
          cp profile-3d-contrib/profile-night-rainbow.svg assets/city-dark.svg
          cp profile-3d-contrib/profile-green-animate.svg assets/city.svg
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          required = ['header.svg', 'typing.svg', 'stack.svg', 'snapshot.svg',
                      'snake.svg', 'snake-dark.svg', 'city.svg', 'city-dark.svg',
                      'pacman-contribution-graph.svg', 'pacman-contribution-graph-dark.svg',
                      'breakout-contribution-graph.svg', 'breakout-contribution-graph-dark.svg']
          for name in required:
              path = Path('assets') / name
              assert path.stat().st_size > 100, f'Empty artwork: {path}'
              assert ET.parse(path).getroot().tag.endswith('svg'), f'Invalid SVG: {path}'
          print(f'Validated {len(required)} profile images')
          PY

      - name: Publish generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile artwork [skip ci]'
            git push
          fi
